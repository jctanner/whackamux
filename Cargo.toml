[package]
name = "whackamux"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui = "0.31"
russh = { version = "0.60", default-features = false, features = ["aws-lc-rs", "rsa"] }
ssh-key = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
futures = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
